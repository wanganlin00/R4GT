project:
  type: website
  output-dir: docs

website:
  title: "R for Graphics and Tables"
  search: true
  back-to-top-navigation: true
  reader-mode: true
  
  navbar:
    background: info
    left:
      - href: index.qmd
        text: "主页"
      - text: "ggplot2 图形"
        href: ggplot2_graphics.qmd
      - text: "base 图形"
        href: base_graphics.qmd
      - text: "表格"
        href: Table.qmd

  sidebar:
    - title: "ggplot2 Graphics"
      style: "docked"
      background: "#ffd9e6"
      foreground: "#1919e6"
      border: true
      alignment: left
      collapse-level: 4
      contents: 
        - ggplot2_graphics.qmd
        - ggproto.qmd
        - ggplot2_extensions.qmd
        - patchwork.qmd

        
        - section: "Point"
          contents: 
            - point.qmd
            - Manhattan.qmd
            
        - section: "Significance"
          contents: 
            - comparison_significance.qmd
            - ggpubr.qmd
            - sina.qmd


        - section: "Line"
          contents: 
            - line.qmd
            - survival.qmd
            - ROC.qmd

        - section: "Rect"
          contents: 
            - barplot.qmd
            - ggprism.qmd
            - ggpattern.qmd
            - angle_rounded_barplot.qmd
            - Diverging_Bars.qmd
            
        - section: "Relationship"
          contents: 
            - 相关图.qmd
            - 热图.qmd
            # - 韦恩图.qmd           # https://github.com/gaospecial/ggVennDiagram/
            # - network.qmd
            # - 凹凸图.qmd          # https://github.com/davidsjoberg/ggbump
            
        - section: "Axis"
          contents:          
            - dual_y_axis.qmd

    - title: "表格"
      contents: 
        - Table.qmd
        - tableone.qmd
        - gtsummary.qmd
        # - flextable.qmd
        # - gtExtras.qmd
        
    - title: "base Graphics"
      contents: 
        - base_graphics.qmd      
       
knitr: 
  opts_chunk: 
    comment: "#>"
    collapse: TRUE

execute:
  message: false
  warning: false
  cache: refresh

toc-depth: 4
number-sections: true
number-depth: 4
code-fold: true
code-link: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    fig-format: svg

editor: visual

